{% extends "base.html" %}
{% block title %}改密碼 — 診所照片歸檔{% endblock %}
{% block content %}
<h1>改密碼</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if ok %}<div class="notice">密碼已更新。你在其他裝置的登入已全部失效，需重新登入。</div>{% endif %}

<form class="action" method="post" action="/password">
  <input type="hidden" name="csrf" value="{{ user.csrf }}">
  <label for="current_password">目前密碼</label>
  <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
  <label for="new_password">新密碼（至少 8 個字元）</label>
  <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
  <label for="new_password2">再輸入一次新密碼</label>
  <input id="new_password2" name="new_password2" type="password" autocomplete="new-password" minlength="8" required>
  <br>
  <button class="btn" type="submit">更新密碼</button>
</form>

<p class="muted">忘記密碼？請管理員到「帳號」頁重設。管理員本人忘記時，請在伺服器主控台執行
<code>python run.py --set-password 帳號</code>（會提示輸入新密碼，不會顯示在畫面上）。</p>
{% endblock %}
