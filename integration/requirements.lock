# requirements.lock — 整合層的相依鎖版檔（v0）
#
# 為什麼要鎖：pyproject.toml 的 dependencies 只寫套件名、不寫版本，每次
# `pip install -e .` 都會抓當下最新版。診所是無人值守的正式環境，上游一個
# 破壞性改版（fastapi/starlette/rapidocr 都有前科）就會讓歸檔停擺，而且
# 「開發機能跑、診所不能跑」這種差異最難查。本檔把整組實際驗過的版本釘死。
#
# 產生方式（在已驗證通過全套測試的 venv 內）：
#     .venv/bin/pip freeze | grep -v '^-e ' > requirements.lock
# 已排除本套件自身的 `-e` 可編輯安裝行與 pip/setuptools/wheel。
#
# 部署安裝（Windows 診所機，見 deploy/AGENT_DEPLOY.md）：
#     py -3.12 -m venv .venv
#     .\.venv\Scripts\pip install -r requirements.lock
#     .\.venv\Scripts\pip install -e . --no-deps
#   ↑ 先裝鎖定版，再用 --no-deps 掛上本套件，pip 才不會回頭解相依把版本頂掉。
#
# 開發機（macOS／Linux）要更新鎖版時：升級套件 → 跑完 `pytest tests -q` 與
# `contract_test.py --selftest` 全綠 → 才重新 freeze 覆蓋本檔。
#
# 注意：本檔是在 macOS／Python 3.14 產生的。onnxruntime、opencv-python、
# shapely 等有平台輪子差異，Windows 上若某個版本無對應 wheel，請在該機重新
# 產生本檔並記錄於部署文件，不要手改單行版本號。
